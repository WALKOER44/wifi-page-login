<!DOCTYPE html>  
<html lang="id">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>MY WIFI</title>  
<link rel="stylesheet" href="style.css">
</head>  
<body>  
  <video id="bgVideo" autoplay loop playsinline>  
    <source src="video.mp4" type="video/mp4">  
  </video>  
  <div class="overlay"></div>  

  <button id="soundBtn" type="button" aria-label="Aktifkan suara">🔊 Aktifkan Suara</button>  

  <div class="login-box">  
    <h1>MY WIFI</h1>  
    <div class="sub">Portal Login Hotspot</div>  
    <div id="errorMsg" class="mik-error" aria-live="polite"></div>  

    <form id="loginForm">  
      <input type="text" id="username" placeholder="Username" autocomplete="username" required>  
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>  
      <button type="submit">CONNECT</button>  
    </form>  
  </div>  

  <script src="script.js"></script>
</body>  
</html>
