<!DOCTYPE html>  
<html lang="id">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>MY WIFI</title>  
<style>  
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }  

  body {  
    height:100vh;  
    overflow:hidden;  
    background:#000;  
    display:flex;  
    align-items:center;  
    justify-content:center;  
  }  

  #bgVideo {  
    position:fixed;  
    top:0; left:0;  
    width:100%; height:100%;  
    object-fit:cover;  
    scale:1.28;
    z-index:0;  
    animation:videoIn 1.4s ease-out both;  
  }  

  .overlay {  
    position:fixed;  
    inset:0;  
    background:rgba(0,0,0,0.18);
    z-index:1;  
  }  

  #soundBtn {  
    position:fixed;  
    top:18px; right:18px;
    z-index:3;  
    padding:9px 13px;
    border:none;  
    border-radius:7px;
    background:rgba(76,39,18,0.82);
    color:#fff;  
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    backdrop-filter:blur(4px);
    transition:background .2s, transform .2s;
  }
  #soundBtn:hover {
    background:rgba(104,53,24,0.95);
    transform:translateY(-1px);
  }

  .login-box {  
    position:relative;  
    z-index:2;  
    background:rgba(74,39,20,0.52);
    border:1px solid rgba(219,137,72,0.55);
    backdrop-filter:blur(12px);  
    -webkit-backdrop-filter:blur(12px);  
    border-radius:16px;  
    padding:40px 35px;  
    width:320px;  
    max-width:90%;  
    text-align:center;  
    box-shadow:0 8px 32px rgba(0,0,0,0.4);  
    animation:fadeInUp .9s .3s cubic-bezier(.22,.68,0,1) both;  
  }  

  .login-box h1 {  
    color:#fff;  
    font-size:32px;  
    letter-spacing:6px;  
    margin-bottom:8px;  
    text-shadow:0 2px 8px rgba(0,0,0,0.6);  
    animation:fadeIn 1.2s .6s both;  
  }  

  .sub {  
    color:rgba(255,255,255,0.8);  
    font-size:12px;  
    margin-bottom:25px;  
    animation:fadeIn 1s .7s both;  
  }  

  .mik-error {  
    color:#ff8080;  
    font-size:12px;  
    margin-bottom:12px;  
  }  

  .login-box input {  
    width:100%;  
    padding:12px 15px;  
    margin-bottom:15px;  
    border:none;  
    border-radius:8px;  
    background:rgba(255,255,255,0.82);
    font-size:14px;  
    outline:none;  
    transition:box-shadow .3s;  
    animation:fadeIn .8s both;  
  }  
  .login-box input:focus {  
    box-shadow:0 0 0 2px rgba(255,255,255,0.6);  
  }  

  .login-box button {  
    width:100%;  
    padding:12px;  
    border:none;  
    border-radius:8px;  
    background:linear-gradient(135deg,#c66b2d,#8f3f16);
    color:#fff;  
    font-size:15px;  
    font-weight:600;  
    letter-spacing:1px;  
    cursor:pointer;  
    transition:transform .2s, box-shadow .2s;  
    animation:fadeIn .8s 1.2s both;  
  }  
  .login-box button:hover {  
    transform:translateY(-2px);  
    box-shadow:0 6px 18px rgba(198,107,45,0.42);
  }  

  @keyframes fadeInUp {  
    from { opacity:0; transform:translateY(20px); }  
    to { opacity:1; transform:translateY(0); }  
  }  

  @keyframes fadeIn {  
    from { opacity:0; }  
    to { opacity:1; }  
  }  

  @keyframes videoIn {  
    from { opacity:0; transform:scale(1.08); }  
    to { opacity:1; transform:scale(1); }  
  }  
</style>  
</head>  
<body>  
  <video id="bgVideo" autoplay loop playsinline>  
    <source src="video.mp4" type="video/mp4">  
  </video>  
  <div class="overlay"></div>  

  <button id="soundBtn" type="button" aria-label="Aktifkan suara">🔊 Aktifkan Suara</button>  

  <div class="login-box">  
    <h1>MY WIFI</h1>  
    <div class="sub">Portal Login Hotspot</div>  
    <div id="errorMsg" class="mik-error" aria-live="polite"></div>  

    <form id="loginForm">  
      <input type="text" id="username" placeholder="Username" autocomplete="username" required>  
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>  
      <button type="submit">CONNECT</button>  
    </form>  
  </div>  

  <script>  
    const video = document.getElementById('bgVideo');  
    const soundBtn = document.getElementById('soundBtn');  
    const loginForm = document.getElementById('loginForm');  
    const errorMsg = document.getElementById('errorMsg');  
    const username = document.getElementById('username');  
    const password = document.getElementById('password');  

    video.muted = true;
    video.volume = 1;
    video.play().catch(() => {});

    const enableSound = () => {
      video.muted = false;
      document.removeEventListener('pointerdown', handleFirstInteraction);
      video.play().then(() => {
        soundBtn.textContent = 'Mute';
        soundBtn.setAttribute('aria-label', 'Mute video');
      }).catch(() => {});
    };

    const handleFirstInteraction = (event) => {
      if (event.target !== soundBtn) enableSound();
    };

    document.addEventListener('pointerdown', handleFirstInteraction);

    soundBtn.addEventListener('click', () => {  
      if (video.muted) {
        enableSound();
        return;
      }

      video.muted = true;
      soundBtn.textContent = '🔊 Aktifkan Suara';
      soundBtn.setAttribute('aria-label', 'Aktifkan suara');
    });  

    loginForm.addEventListener('submit', (e) => {  
      e.preventDefault();  

      const user = username.value.trim();  
      const pass = password.value.trim();  

      if (!user || !pass) {  
        errorMsg.textContent = 'Username dan password harus diisi.';  
        return;  
      }  

      errorMsg.textContent = '';  
      const submitBtn = loginForm.querySelector('button');  
      submitBtn.disabled = true;  
      submitBtn.textContent = 'CONNECTING...';  

      setTimeout(() => {  
        alert('Login berhasil! Selamat datang di MY WIFI.');  
        submitBtn.disabled = false;  
        submitBtn.textContent = 'CONNECT';  
      }, 1200);  
    });  
  </script>  
</body>  
</html>
